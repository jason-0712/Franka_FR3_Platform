schema_version: 1
backend: mock
permission: read_only
network: {host: 127.0.0.1, port: 8765}
log_path: artifacts/franka_platform/platform.jsonl
robot: {model: FR3, ip: null, network_interface: null}
base_frame_id: base
tool_frame_id: fr3_hand_tcp
joint_names: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]
controller_to_tool:
  position_m: [0, 0, 0]
  quaternion_xyzw: [0, 0, 0, 1]
  source: mock identity transform; never use as a field calibration
observation_profile: dual_camera
cameras:
  - {name: primary, serial: null, topic: /mock/primary, frame: mock_primary, calibration_path: null}
  - {name: wrist, serial: null, topic: /mock/wrist, frame: mock_wrist, calibration_path: null}
timing:
  observation_max_age_s: 0.5
  state_max_age_s: 0.5
  camera_max_age_s: 0.5
  pair_max_skew_s: 0.1
  command_timeout_s: 1.0
  lease_timeout_s: 3.0
  watchdog_period_s: 0.01
  position_tolerance_m: 0.0001
  rotation_tolerance_rad: 0.001
  joint_tolerance_rad: 0.001
  gripper_tolerance_m: 0.0001
limits:
  # Mock-only bounds. These are not verified robot execution limits.
  joint_lower_rad: [-2.9007, -1.8361, -2.9007, -3.0718, -2.8763, 0.4398, -3.0508]
  joint_upper_rad: [2.9007, 1.8361, 2.9007, -0.1169, 2.8763, 4.6216, 3.0508]
  workspace_lower_m: [0.2, -0.3, 0.15]
  workspace_upper_m: [0.7, 0.3, 0.7]
  max_translation_step_m: 0.02
  max_rotation_step_rad: 0.2
  max_joint_step_rad: 0.05
  gripper_min_width_m: 0.0
  gripper_max_width_m: 0.08
  gripper_speed_m_s: 0.02
ros:
  namespace: ''
  domain_id: 30
  middleware: rmw_cyclonedds_cpp
  joint_state_topic: /franka/joint_states
  gripper_state_topic: /franka_gripper/joint_states
  finger_joint_names: [fr3_finger_joint1, fr3_finger_joint2]
  pose_target_topic: /target_pose
  joint_target_topic: /target_joint
  gripper_move_action: /franka_gripper/move
  cartesian_controller: cartesian_impedance_controller
  joint_controller: joint_impedance_controller
  controller_manager: /controller_manager
  robot_description_file: null
